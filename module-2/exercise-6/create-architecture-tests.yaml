commandLineOptions:
  maxConcurrency: 20

prompts:
  - id: create-architecture
    raw: |
      # Create Architecture

      ## Role
      You are a Senior Solutions Architect producing implementation-ready architecture documents.

      ## Task
      Given a Product Requirements Document, produce a comprehensive Architecture Document with system design, data modeling, API design, security, and deployment patterns.

      ## Context
      Technical environment for TeamPulse:
      - Frontend: React 18, TypeScript, Vite, Tailwind CSS, React Query, Recharts
      - Backend: Express 4 on Node.js 20 LTS with TypeScript
      - Database: PostgreSQL 16 with Prisma ORM
      - Auth: Entra ID OIDC via openid-client library
      - Sessions: Postgres-backed express-session (connect-pg-simple)
      - Scheduler: In-process Node.js polling (no Redis/BullMQ)
      - Email: nodemailer against SMTP relay
      - Containerization: Multi-stage Dockerfile, single runtime, docker-compose

      ## Constraints
      Architecture must address:
      - Schema-level privacy: responses table has NO FK to team_members (schema enforcement)
      - Scheduling: ±60s dispatch tolerance, ±30s close tolerance (drift correction required)
      - Multi-tenancy: manager_id scoping in all queries (authorization at data layer)
      - Single container: No multi-container orchestration for V1 (keep deployment simple)

      ## Architecture Document Format

      Include these 8 sections:

      1. **System Overview Diagram**: Named components with specific tech (React 18, Express 4, PostgreSQL 16)
      2. **Component Architecture**: Each component specifies technology, responsibilities, communication protocol, data ownership
      3. **Data Architecture**: Core tables (managers, teams, survey_configs, survey_instances, responses), relationships, consistency model
      4. **API Surface**: Manager and engineer endpoints with HTTP methods, protocols, auth flows
      5. **Security Architecture**: Authentication (Entra ID OIDC), authorization (tenant scoping), tokens, rate limiting
      6. **Deployment & Operations**: Docker container, docker-compose, scheduler design, monitoring hooks
      7. **Open Technical Decisions**: Scheduler scaling? Session storage scaling? Analytics approach? Why each matters.
      8. **Tradeoffs & Rationale**: Why this architecture, known limitations, future pivot points

      Always emphasize specific technology names, not generic layers. Surface the privacy-by-schema design pattern. Flag open decisions with "why it matters" explanations.

      ## Product Requirements Document
      {{prd_input}}

defaultTest:
  options:
    provider: 'exec: node ../../claude.js'

providers:
  - id: 'exec: node ../../claude.js'
    label: haiku
    config:
      model: haiku

tests:
  - description: "TeamPulse Architecture — Iteration Test"
    vars:
      prd_input: |
        # TeamPulse PRD (Summary)

        ## Overview
        Self-hosted team health check system. Managers configure anonymous pulse surveys (5-7 questions, weekly/bi-weekly). Engineers answer via one-time link. Results aggregated into trend dashboard. Single Docker deployment for solo developer.

        ## Key Goals
        - Managers stand up survey in <5 minutes
        - Guarantee anonymity at data-model level
        - Show trends over time
        - Multi-manager teams with isolation

        ## Core Features
        1. Manager authentication (Entra ID SSO)
        2. Team & membership management
        3. Survey configuration (fixed question bank)
        4. Scheduled survey dispatch (drift-corrected)
        5. Email notifications (required) + Slack webhooks (optional)
        6. Survey response form (mobile-accessible, <3 min)
        7. Response aggregation with minimum threshold guard
        8. Trend dashboard
        9. Multi-tenant isolation
        10. CSV export (optional)
        11. Survey history (optional)

        ## Data Model (PostgreSQL)
        - managers(id, entra_object_id, email, ...)
        - teams(id, manager_id, name, slack_webhook_url, ...)
        - team_members(id, team_id, email, status, ...)
        - survey_configs(id, team_id, frequency, send_time_utc, ...)
        - survey_instances(id, team_id, survey_config_id, sent_at, ...)
        - survey_tokens(id, survey_instance_id, member_id_hash, ...)
        - responses(id, survey_instance_id, question_id, answer_value, ...)
        - **CRITICAL: responses has NO FK to team_members or survey_tokens**

        ## Technical Stack
        - Frontend: React 18 + TypeScript, Vite, Tailwind, React Query, Recharts
        - Backend: Node.js 20 LTS, Express 4 + TypeScript, Prisma
        - Database: PostgreSQL 16
        - Auth: Entra ID OIDC
        - Sessions: Postgres-backed
        - Scheduler: In-process, no BullMQ
        - Container: Multi-stage Docker + docker-compose

        ## Non-Functional Requirements
        - Survey dispatch: ±60s tolerance
        - Survey close: ±30s tolerance
        - Form load: <1.5s p95 on 4G
        - Dashboard query: <500ms p95
        - Scale: 50 teams × 15 members max
        - Single Docker container (no HA, no multi-region)

        ## Security
        - OIDC-only auth
        - HTTPOnly/Secure session cookies
        - Tenant isolation (manager_id in queries)
        - Token rate limiting
        - TLS 1.2+
    assert: []
