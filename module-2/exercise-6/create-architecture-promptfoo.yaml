commandLineOptions:
  maxConcurrency: 20

prompts:
  - id: create-architecture-react-node
    raw: |
      # Create Architecture

      ## Role
      You are a Senior Solutions Architect producing implementation-ready architecture documents.

      ## Task
      Given a Product Requirements Document, produce a comprehensive Architecture Document with system design, data modeling, API design, security, and deployment patterns.

      ## Context
      Technical environment for TeamPulse (React/Node/Postgres stack):
      - Frontend: React 18, TypeScript, Vite, Tailwind CSS, React Query, Recharts
      - Backend: Express 4 on Node.js 20 LTS with TypeScript
      - Database: PostgreSQL 16 with Prisma ORM
      - Auth: Entra ID OIDC via openid-client library
      - Sessions: Postgres-backed express-session (connect-pg-simple)
      - Scheduler: In-process Node.js polling (no Redis/BullMQ)
      - Email: nodemailer against SMTP relay
      - Containerization: Multi-stage Dockerfile, single runtime, docker-compose

      ## Constraints
      Architecture must address:
      - Schema-level privacy: responses table has NO FK to team_members (schema enforcement)
      - Scheduling: ±60s dispatch tolerance, ±30s close tolerance (drift correction required)
      - Multi-tenancy: manager_id scoping in all queries (authorization at data layer)
      - Single container: No multi-container orchestration for V1 (keep deployment simple)

      ## Architecture Document Format
      Include these 8 sections:
      1. **System Overview Diagram**: Named components with specific tech (React 18, Express 4, PostgreSQL 16)
      2. **Component Architecture**: Each component specifies technology, responsibilities, communication protocol, data ownership
      3. **Data Architecture**: Core tables, relationships, consistency model
      4. **API Surface**: Manager and engineer endpoints with HTTP methods
      5. **Security Architecture**: Authentication (Entra ID OIDC), authorization (tenant scoping), tokens, rate limiting
      6. **Deployment & Operations**: Docker container, docker-compose, scheduler design, monitoring
      7. **Open Technical Decisions**: Scheduler scaling? Session storage scaling? Why each matters.
      8. **Tradeoffs & Rationale**: Why this architecture, known limitations, future pivot points

      ## Product Requirements Document
      {{prd_input}}

  - id: create-architecture-python-fastapi
    raw: |
      # Create Architecture

      ## Role
      You are a Senior Solutions Architect producing implementation-ready architecture documents.

      ## Task
      Given a Product Requirements Document, produce a comprehensive Architecture Document with system design, data modeling, API design, security, and deployment patterns.

      ## Context
      Technical environment for TeamPulse (Python/FastAPI/MongoDB stack):
      - Frontend: React 18, TypeScript, Vite, Tailwind CSS, React Query, Recharts (same frontend)
      - Backend: Python 3.11 with FastAPI framework
      - Database: MongoDB with PyMongo driver
      - Auth: Auth0 or self-hosted Keycloak for OIDC
      - Sessions: Redis-backed session store
      - Scheduler: Celery with RabbitMQ message broker
      - Email: SendGrid or Mailgun API
      - Containerization: Docker Compose (separate services: app, MongoDB, Redis, RabbitMQ)

      ## Constraints
      Architecture must address:
      - Schema-level privacy: MongoDB documents ensure no user_id in response collection (document structure)
      - Scheduling: ±60s dispatch tolerance, ±30s close tolerance (Celery beat monitoring)
      - Multi-tenancy: manager_id filtering in all queries (application layer)
      - Multi-service: Each service independently scalable (Celery workers, app replicas, Redis cluster)

      ## Architecture Document Format
      Include these 8 sections:
      1. **System Overview Diagram**: Named components with specific tech (React 18, FastAPI, MongoDB, Redis, RabbitMQ)
      2. **Component Architecture**: Each component specifies technology, responsibilities, communication protocol, data ownership
      3. **Data Architecture**: MongoDB collections, relationships, consistency model
      4. **API Surface**: Manager and engineer endpoints with HTTP methods, FastAPI route structure
      5. **Security Architecture**: Authentication (Auth0/Keycloak OIDC), authorization (tenant scoping), tokens, rate limiting
      6. **Deployment & Operations**: Docker Compose with multiple services, Celery workers, Redis, RabbitMQ
      7. **Open Technical Decisions**: Celery scaling? Message broker choice? Why each matters.
      8. **Tradeoffs & Rationale**: Why this architecture, known limitations, future pivot points

      ## Product Requirements Document
      {{prd_input}}

defaultTest:
  options:
    provider: 'exec: node ../../claude.js'

providers:
  - id: 'exec: node ../../claude.js'
    label: haiku
    config:
      model: haiku

tests:
  - description: "TeamPulse Architecture — React/Node/Postgres (Iteration 1)"
    vars:
      prd_input: |
        # TeamPulse PRD (Summary)
        Self-hosted team health check system. Managers configure anonymous pulse surveys. Engineers answer via one-time link. Results aggregated into trend dashboard.

        ## Key Features
        Manager authentication (Entra ID SSO), team management, survey configuration, scheduled dispatch, email notifications, survey form, response aggregation, trend dashboard, multi-tenant isolation, CSV export.

        ## Data Model
        managers, teams, team_members, survey_configs, survey_instances, survey_tokens, responses
        **CRITICAL: responses has NO FK to team_members or survey_tokens**

        ## Non-Functional Requirements
        - Survey dispatch: ±60s tolerance, ±30s close tolerance
        - Form load: <1.5s p95 on 4G
        - Dashboard query: <500ms p95
        - Scale: 50 teams × 15 members max
    prompt: create-architecture-react-node
    assert: []

  - description: "TeamPulse Architecture — Python/FastAPI/MongoDB (Load-Bearing Context Test)"
    vars:
      prd_input: |
        # TeamPulse PRD (Summary)
        Self-hosted team health check system. Managers configure anonymous pulse surveys. Engineers answer via one-time link. Results aggregated into trend dashboard.

        ## Key Features
        Manager authentication (Entra ID SSO), team management, survey configuration, scheduled dispatch, email notifications, survey form, response aggregation, trend dashboard, multi-tenant isolation, CSV export.

        ## Data Model
        managers, teams, team_members, survey_configs, survey_instances, survey_tokens, responses
        **CRITICAL: responses has NO FK to team_members or survey_tokens**

        ## Non-Functional Requirements
        - Survey dispatch: ±60s tolerance, ±30s close tolerance
        - Form load: <1.5s p95 on 4G
        - Dashboard query: <500ms p95
        - Scale: 50 teams × 15 members max
    prompt: create-architecture-python-fastapi
    assert: []
